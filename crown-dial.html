<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crown Dial</title>
<style>
:root{
  --bg:#101216; --panel:#16191f; --line:#262a33; --text:#e2e5ea; --muted:#8b929d; --dim:#5d636d;
  --accent:#9fb6d8; --amber:#e2a845; --amber-bg:rgba(226,168,69,.10); --red:#f0544b; --red-bg:rgba(240,84,75,.10);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:120px;overflow-x:hidden}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 16px}
h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.amber{color:var(--amber)} .red{color:var(--red)}
.notice{border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:8px;margin-bottom:12px;color:var(--accent)}
.notice:empty{display:none}
.menu{list-style:none;padding:0;margin:0}
.menu li{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.menu kbd{min-width:1.8em;text-align:center}
kbd{font:inherit;font-size:12px;font-variant-numeric:tabular-nums;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--text);background:var(--panel);white-space:nowrap}
.hist{font-size:13px;color:var(--muted)}
.hist div{padding:4px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
/* setup */
.field{margin:14px 0}
.field label,.field .lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
textarea,input[type=text],input[type=number]{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;font-variant-numeric:tabular-nums}
textarea{min-height:150px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--text);margin:0;font-size:14px}
.seg input{accent-color:var(--accent);margin:0}
.seg label:focus-within{outline:2px solid var(--accent)}
.row2{display:flex;gap:12px;flex-wrap:wrap}.row2>.field{flex:1 1 140px}
.err{color:var(--amber);min-height:1.4em}
.hint{font-size:13px;color:var(--dim)}
/* run */
.head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;letter-spacing:.04em}
.qid{font-size:clamp(18px,5vw,26px);margin:10px 0 0;overflow-wrap:anywhere}
.clock{font-variant-numeric:tabular-nums;font-weight:300;letter-spacing:-.02em;line-height:1;margin:14px 0 6px;font-size:clamp(64px,24vw,176px);white-space:nowrap}
.clock.long{font-size:clamp(46px,16vw,150px)}
.clock.amber{color:var(--amber)} .clock.red{color:var(--red)}
.clabel{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.info{display:flex;flex-wrap:wrap;gap:6px 18px;margin:10px 0;font-size:14px}
.info span b{font-weight:500;color:var(--muted);margin-right:6px}
.banner{border-left:3px solid var(--accent);background:var(--panel);padding:8px 12px;margin:8px 0;border-radius:0 6px 6px 0}
.banner.amber{border-color:var(--amber);background:var(--amber-bg);color:var(--amber)}
.banner.red{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.prompt{border:1px solid var(--accent);padding:10px 12px;border-radius:8px;margin:10px 0}
.msg{color:var(--amber);margin:8px 0}
.tag-peek{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--accent);margin-left:6px;vertical-align:middle}
.strip{display:flex;flex-wrap:wrap;gap:4px;margin:16px 0 4px}
.strip span{min-width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:5px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.strip span.cur{border-color:var(--accent);color:var(--text)}
.strip span.amber{border-color:var(--amber);color:var(--amber)}
.strip span.red{border-color:var(--red);color:var(--red)}
.strip-key{font-size:12px;color:var(--dim)}
.rows{margin:10px 0}
.r{display:grid;grid-template-columns:1.6em 1fr auto;gap:2px 8px;padding:7px 6px;border-bottom:1px solid var(--line);align-items:baseline}
.r.focus{background:var(--panel);outline:1px solid var(--accent);border-radius:6px}
.r .mk{font-size:16px;text-align:center}
.r .id{overflow-wrap:anywhere}
.r .meta{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.r .sub{grid-column:2/4;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.paused{text-align:center;padding:20px 0}
.paused .big{font-size:clamp(28px,9vw,56px);letter-spacing:.2em;color:var(--accent);margin:10px 0}
.secs{display:flex;gap:8px;margin:12px 0}
.secs div{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.secs div.on{border-color:var(--accent)}
.secs b{display:block;font-size:13px;color:var(--muted);font-weight:500}
.secs span{font-size:clamp(16px,5vw,22px)}
.sum{white-space:normal}
.sum dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0}
.sum dt{color:var(--muted)} .sum dd{margin:0;overflow-wrap:anywhere}
#inputRow{margin:10px 0}
#inputRow label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
#copyBox textarea{min-height:200px;font-size:12px}
.copied{color:var(--accent);margin-left:8px}
#tests li{padding:3px 0;border-bottom:1px solid var(--line);font-size:13px;list-style:none}
#tests{padding:0}
/* legend */
#legend{position:fixed;left:0;right:0;bottom:0;background:rgba(16,18,22,.97);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
#legend .in{max-width:640px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
#legend .in span{white-space:nowrap}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.clock{transition:color .4s}}
</style>
</head>
<body>
<main id="app">
  <div id="notice" class="notice" role="status"></div>
  <section id="screen-home" hidden></section>
  <section id="screen-setup" hidden>
    <h1 id="setupTitle">Setup</h1>
    <div class="field" data-modes="practice reattempt">
      <label for="ids" id="idsLabel">Question IDs — one per line (or just a count)</label>
      <textarea id="ids" spellcheck="false" placeholder="O-II Q12 · TC0064&#10;O-II Q13 · TC0065&#10;…&#10;&#10;or just: 12"></textarea>
      <div class="hint" id="idsHint"></div>
    </div>
    <div class="field" data-modes="practice">
      <span class="lbl" id="blockLbl">Block length (solve + log)</span>
      <div class="seg" role="radiogroup" aria-labelledby="blockLbl">
        <label><input type="radio" name="block" value="90" checked> 90 · 75+15</label>
        <label><input type="radio" name="block" value="60"> 60 · 50+10</label>
        <label><input type="radio" name="block" value="45"> 45 · 37+8</label>
        <label><input type="radio" name="block" value="custom"> custom</label>
      </div>
    </div>
    <div class="row2" data-modes="practice">
      <div class="field"><label for="customMin">Custom block (min)</label><input id="customMin" type="number" min="6" max="300" step="1" value="30"></div>
      <div class="field"><label for="targetMin">Target pace (min / question)</label><input id="targetMin" type="number" min="0.5" max="60" step="0.5" value="4.5"></div>
    </div>
    <div class="hint" data-modes="practice" id="splitHint"></div>
    <div class="field" data-modes="blurt mock">
      <label for="label" id="labelLbl">Label (optional)</label>
      <input id="label" type="text" maxlength="60" spellcheck="false">
    </div>
    <div class="hint" id="modeHint"></div>
    <div class="err" id="setupErr" role="alert"></div>
  </section>
  <section id="screen-run" hidden>
    <div id="runBody"></div>
    <div id="inputRow" hidden><label for="field" id="fieldLabel"></label><input id="field" type="text" autocomplete="off" spellcheck="false"></div>
    <div id="runTail"></div>
    <div id="copyBox" hidden><h2>Copy this text</h2><textarea id="copyText" readonly></textarea></div>
  </section>
  <section id="screen-test" hidden><h1 id="testHead">Self-test</h1><ul id="tests"></ul></section>
</main>
<footer id="legend"><div class="in" id="legendIn"></div></footer>

<script id="core">
/* Crown Dial — Core: a pure state machine. No DOM, no clock, no storage, no timers, no randomness. */
globalThis.Core = (function () {
  'use strict';
  var SEC = 1000, MIN = 60 * SEC, DAY = 24 * 60 * MIN;
  var K = {
    DIR_MS: 2 * MIN, NAG_MS: 30 * SEC, PASS2_CAP_MS: 5 * MIN, REATTEMPT_CAP_MS: 10 * MIN,
    BLURT_WRITE_MS: 30 * MIN, BLURT_CHECK_MS: 5 * MIN, PAPER_MS: 180 * MIN, MOCK_BREAK_MS: 45 * MIN,
    PRACTICE_MIN_Q: 10, PRACTICE_MAX_Q: 15, MAX_Q: 50, HISTORY_MAX: 30, ANSWER_MAX: 40, NOTE_MAX: 140,
    BREAK_PRESETS: [5, 10, 15]
  };
  var PRESETS = { 90: [75, 15], 60: [50, 10], 45: [37, 8] };
  var TAGS = ['C', 'A', 'S', 'T'];
  var SETUP_MODES = ['practice', 'reattempt', 'blurt', 'mock'];
  var MODE_NAMES = { practice: 'Practice set', reattempt: 'Re-attempt', blurt: 'Blurt', mock: 'Mock paper', 'break': 'Break' };
  var SECS = ['P', 'C', 'M'];
  var KNOWN = ['TICK', 'GO_SETUP', 'GO_HOME', 'START', 'PAUSE', 'CONTINUE', 'PARK', 'OPEN_ANSWER', 'COMMIT', 'CANCEL',
    'BLANK', 'PEEK', 'TO_LOG', 'FOCUS', 'MARK', 'TAG', 'OPEN_NOTE', 'SAVE_NOTE', 'FINISH', 'NEW', 'ABANDON',
    'ABANDON_CONFIRM', 'SECTION', 'END_EARLY', 'START_PAPER2', 'END_BREAK', 'COPY'];

  function clone(x) { return x == null ? x : JSON.parse(JSON.stringify(x)); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(ms) {
    var s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return h ? h + ':' + pad(m) + ':' + pad(x) : m + ':' + pad(x);
  }
  function fmtDown(ms) { return fmt(Math.ceil(Math.max(0, ms) / 1000) * 1000); }
  // countdown: remaining > 0 -> "m:ss"; below zero -> "+m:ss" overrun
  function cd(rem) { return rem >= 0 ? { text: fmtDown(rem), over: false } : { text: '+' + fmt(-rem), over: true }; }
  function isoDay(ms) { return new Date(ms).toISOString().slice(0, 10); }
  function localStamp(ms, tz) { var d = new Date(ms + tz * MIN).toISOString(); return d.slice(0, 10) + ' ' + d.slice(11, 16); }

  /* ---------- time model: everything from timestamps, pauses subtracted ---------- */
  function pauseOverlap(P, a, b) {
    var o = 0;
    for (var i = 0; i < P.length; i++) {
      var s = Math.max(P[i].start, a), e = Math.min(P[i].end == null ? Infinity : P[i].end, b);
      if (e > s) o += e - s;
    }
    return o;
  }
  function active(P, a, b) { return b <= a ? 0 : (b - a) - pauseOverlap(P, a, b); }
  // earliest T >= a such that active(P, a, T) >= ms; Infinity if an open pause blocks it
  function atActive(P, a, ms) {
    var t = a, rem = Math.max(0, ms);
    for (var i = 0; i < P.length; i++) {
      var p = P[i];
      if (p.end != null && p.end <= t) continue;
      var ps = Math.max(p.start, t);
      if (ps - t >= rem) return t + rem;
      rem -= ps - t;
      if (p.end == null) return Infinity;
      t = p.end;
    }
    return t + rem;
  }
  function isPaused(b) { var p = b.pauses[b.pauses.length - 1]; return !!p && p.end == null; }
  function openSeg(q) { var g = q.segments[q.segments.length - 1]; return g && g.end == null ? g : null; }
  function qActive(b, q, now) {
    var s = 0;
    for (var i = 0; i < q.segments.length; i++) { var g = q.segments[i]; s += active(b.pauses, g.start, g.end == null ? now : g.end); }
    return s;
  }
  function qDueTotal(b, q, total) {
    var g = openSeg(q); if (!g) return null;
    var closed = 0;
    for (var i = 0; i < q.segments.length; i++) { var x = q.segments[i]; if (x.end != null) closed += active(b.pauses, x.start, x.end); }
    return atActive(b.pauses, g.start, total - closed);
  }
  function curQ(b) { var q = b.cur >= 0 ? b.questions[b.cur] : null; return q && q.status === 'active' ? q : null; }

  function splits(blockMin) {
    var m = Math.round(Number(blockMin));
    if (!isFinite(m) || m <= 0) return null;
    if (PRESETS[m]) return { blockMin: m, solveMin: PRESETS[m][0], logMin: PRESETS[m][1] };
    var s = Math.round(m * 5 / 6);
    return { blockMin: m, solveMin: s, logMin: m - s };
  }
  function parseIds(text) {
    var lines = String(text == null ? '' : text).split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean);
    if (lines.length === 1 && /^\d{1,3}$/.test(lines[0])) {
      var n = +lines[0], out = [];
      for (var i = 1; i <= n; i++) out.push('Q' + i);
      return out;
    }
    return lines.map(function (l) { return l.slice(0, 60); });
  }

  function initial() {
    return { v: 1, screen: 'home', setupMode: null, setupError: null, block: null, history: [],
      prefs: { targetMin: 4.5, blockChoice: '90', customMin: 30 } };
  }
  function isValidState(s) {
    return !!s && typeof s === 'object' && s.v === 1 && ['home', 'setup', 'block'].indexOf(s.screen) >= 0 &&
      Array.isArray(s.history) && (s.block === null || (typeof s.block === 'object' && Array.isArray(s.block.pauses))) &&
      (s.screen !== 'block' || !!s.block);
  }
  function mkQ(id) {
    return { id: id, status: 'unreached', startedAt: null, endedAt: null, segments: [], answer: null, peekedAt: null,
      parkedAt: null, dirAt: null, dirChoice: null, dirChoiceAt: null, targetAt: null, doubleAt: null, nags: 0,
      capAt: null, timedOut: false, mark: null, tag: null, note: null };
  }
  function baseBlock(mode, t, tz, label) {
    return { mode: mode, label: label || null, startedAt: t, tz: tz, lastT: t, phase: null, endedAt: null,
      abandonedAt: null, pauses: [], ui: { input: null, msg: null } };
  }

  /* ---------- scheduled events (catch-up) ---------- */
  function nextEvent(b) {
    var P = b.pauses, c = [];
    function add(at, kind) { if (at != null && isFinite(at)) c.push({ at: at, kind: kind }); }
    if (b.mode === 'practice' || b.mode === 'reattempt') {
      var q = curQ(b);
      if (q) {
        var g = openSeg(q);
        if (b.mode === 'practice') {
          var T = b.config.targetMs;
          if (b.phase === 'solve' && g.pass === 1 && q.dirAt == null) add(qDueTotal(b, q, K.DIR_MS), 'direction');
          if (q.targetAt == null) add(qDueTotal(b, q, T), 'target');
          else if (q.doubleAt == null) add(qDueTotal(b, q, 2 * T), 'double');
          else add(qDueTotal(b, q, 2 * T + K.NAG_MS * (q.nags + 1)), 'nag');
          if (g.pass === 2 && q.capAt == null) add(atActive(P, g.start, K.PASS2_CAP_MS), 'cap');
        } else if (q.capAt == null) add(qDueTotal(b, q, b.config.capMs), 'cap');
      }
      if (b.mode === 'practice') {
        if (b.phase === 'solve') add(atActive(P, b.solveStartedAt, b.config.solveMs), 'solveEnd');
        else if (b.phase === 'log' && b.logOverAt == null) add(atActive(P, b.logStartedAt, b.config.logMs), 'logEnd');
      }
    } else if (b.mode === 'blurt') {
      if (b.phase === 'write') add(atActive(P, b.writeStartedAt, b.config.writeMs), 'writeEnd');
      else if (b.phase === 'check' && b.checkOverAt == null) add(atActive(P, b.checkStartedAt, b.config.checkMs), 'checkEnd');
    } else if (b.mode === 'mock') {
      if (b.phase === 'paper1' || b.phase === 'paper2') add(atActive(P, b.papers[b.papers.length - 1].startedAt, b.config.paperMs), 'paperEnd');
      else if (b.phase === 'break' && b.breakOverAt == null) add(atActive(P, b.breakStartedAt, b.config.breakMs), 'breakEnd');
    } else if (b.mode === 'break') {
      if (b.phase === 'break' && b.overAt == null) add(atActive(P, b.startedAt, b.config.breakMs), 'breakOver');
    }
    var best = null;
    for (var i = 0; i < c.length; i++) if (!best || c[i].at < best.at) best = c[i];
    return best;
  }
  function snd(name) { return { type: 'sound', name: name }; }
  function ntf(title, body) { return { type: 'notify', title: title, body: body }; }
  function applyEvent(b, ev, fx) {
    var at = ev.at, q = curQ(b);
    switch (ev.kind) {
      case 'direction': q.dirAt = at; fx.push(snd('direction'), ntf('Direction?', q.id + ' · 2:00 — C continue, P park ↩')); break;
      case 'target': q.targetAt = at; fx.push(snd('soft')); break;
      case 'double': q.doubleAt = at; fx.push(snd('nag'), ntf('2× target pace', q.id + ' — commit or blank')); break;
      case 'nag': q.nags += 1; fx.push(snd('nag')); break;
      case 'cap': q.capAt = at; fx.push(snd('cap'), ntf('Cap reached', q.id + ' — commit or blank now')); break;
      case 'solveEnd':
        b.phase = 'log'; b.solveEndedAt = at; b.logStartedAt = at; b.focus = 0;
        b.questions.forEach(function (x) {
          if (x.status === 'unreached' || x.status === 'parked') { x.mark = 'x'; x.tag = 'T'; x.timedOut = true; }
        });
        if (q) b.overtimeIdx = b.cur; else b.cur = -1;
        fx.push(snd('loud'), ntf('Solve time over', q ? 'Finish ' + q.id + ' now (commit or blank), then log.' : 'Log phase started.'));
        break;
      case 'logEnd': b.logOverAt = at; fx.push(snd('loud'), ntf('Log time over', 'Finish marking — overrun is being recorded.')); break;
      case 'writeEnd':
        b.writeEndedAt = at; b.phase = 'check'; b.checkStartedAt = at;
        fx.push(snd('loud'), ntf('Write time over', 'Check for 5:00.')); break;
      case 'checkEnd': b.checkOverAt = at; fx.push(snd('loud'), ntf('Check time over', 'Overrun is being recorded — F to finish.')); break;
      case 'paperEnd': endPaper(b, at, false); fx.push(snd('loud'), ntf('Paper ' + b.papers.length + ' over', b.phase === 'break' ? '45-minute break started.' : 'Mock finished.')); break;
      case 'breakEnd': b.breakOverAt = at; fx.push(snd('loud'), ntf('Break over', 'Enter starts Paper 2 — overrun is being recorded.')); break;
      case 'breakOver': b.overAt = at; fx.push(snd('loud'), ntf('Break over', 'Start your next block — overrun is being recorded.')); break;
    }
    if (at > b.lastT) b.lastT = at;
  }
  function advance(b, t, fx) {
    for (var guard = 0; guard < 2000000; guard++) {
      var ev = nextEvent(b);
      if (!ev || ev.at > t) return;
      applyEvent(b, ev, fx);
    }
  }

  /* ---------- transitions ---------- */
  function activate(b, i, t) {
    var q = b.questions[i];
    q.status = 'active';
    if (q.startedAt == null) q.startedAt = t;
    q.segments.push({ start: t, end: null, pass: b.pass });
    b.cur = i;
  }
  function nextQuestion(b, t) {
    var i = -1, qs = b.questions, k;
    if (b.pass === 1) {
      for (k = 0; k < qs.length; k++) if (qs[k].status === 'unreached') { i = k; break; }
      if (i < 0 && b.mode === 'practice') {
        for (k = 0; k < qs.length; k++) if (qs[k].status === 'parked') { i = k; break; }
        if (i >= 0) b.pass = 2;
      }
    } else {
      for (k = 0; k < qs.length; k++) if (qs[k].status === 'parked') { i = k; break; }
    }
    if (i >= 0) { activate(b, i, t); return; }
    b.cur = -1;
    if (b.mode === 'reattempt') { b.phase = 'log'; b.solveEndedAt = t; b.logStartedAt = t; b.focus = 0; }
  }
  function endQuestion(b, q, status, answer, t) {
    var g = openSeg(q);
    g.end = t; q.status = status; q.answer = answer; q.endedAt = t; b.ui.input = null;
    if (status === 'blank' || q.peekedAt != null) q.mark = 'x';
    if (q.dirAt != null && q.dirChoice == null) { q.dirChoice = status; q.dirChoiceAt = t; }
    if (b.overtimeIdx != null) {
      b.overrun.solveMs = active(b.pauses, b.solveEndedAt, t);
      b.overtimeIdx = null; b.cur = -1; b.focus = 0;
      return;
    }
    nextQuestion(b, t);
  }
  function enterLog(b, t) { b.phase = 'log'; b.solveEndedAt = t; b.logStartedAt = t; b.focus = 0; b.cur = -1; }
  function endPaper(b, t, early) {
    var p = b.papers[b.papers.length - 1], g = p.segs[p.segs.length - 1];
    if (g && g.end == null) g.end = t;
    p.endedAt = t; p.early = !!early;
    if (b.phase === 'paper1') { b.phase = 'break'; b.breakStartedAt = t; }

    var name = keyName(e), v = Core.view(state, Date.now());
    var hit = null;
    for (var i = 0; i < v.keys.length; i++) if (v.keys[i].action && v.keys[i].keys.indexOf(name) >= 0) { hit = v.keys[i]; break; }
    if (!hit) return;
    e.preventDefault();
    if (noticeTimer && $('notice').textContent && /Resumed/.test($('notice').textContent)) $('notice').textContent = '';
    if (hit.action.type === 'COPY') { doCopy(); return; }
    if (hit.action.type === 'FORM_START') { startFromForm(); return; }
    var a = {}; for (var k in hit.action) a[k] = hit.action[k];
    dispatch(a);
  });

  /* ----- boot ----- */
  var wasLive = state.screen === 'block' && state.block && ['summary', 'done'].indexOf(state.block.phase) < 0;
  dispatch({ type: 'TICK' });
  if (notice) showNotice(notice);
  else if (!storageOk) showNotice('localStorage is unavailable — this session will not survive a reload.');
  else if (wasLive) showNotice('Resumed — clock kept running.');
  setInterval(function () { dispatch({ type: 'TICK' }); }, 250);
  document.addEventListener('visibilitychange', function () { dispatch({ type: 'TICK' }); });
})();
</script>
</body>
</html>
